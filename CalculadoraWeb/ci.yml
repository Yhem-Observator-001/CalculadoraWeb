name: Calculadora Web CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  verificar:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Mostrar archivos
        run: ls -la

      - name: Verificar HTML
        run: test -f index.html

      - name: Verificar JavaScript
        run: test -f script.js

      - name: Verificar CSS
        run: test -f style.css

      - name: Verificar Dockerfile
        run: test -f Dockerfile

      - name: Proyecto correcto
        run: echo "Proyecto verificado correctamente"