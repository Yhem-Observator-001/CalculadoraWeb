<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora </title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="calculadora">

        <h1>___CALCULADORA___</h1>


        <input type="number" id="numero1" placeholder="Primer número">

        <input type="number" id="numero2" placeholder="Segundo número">

        <div class="botones">

            <button onclick="sumar()">Sumar</button>

            <button onclick="restar()">Restar</button>

            <button onclick="multiplicar()">Multiplicar</button>

            <button onclick="dividir()">Dividir</button>

            <button onclick="potencia()">Potencia</button>

            <button onclick="raiz()">Raíz Cuadrada</button>

        </div>

        <h2 id="resultado">

            Resultado:

        </h2>

    </div>

<script src="script.js"></script>

</body>

</html>
